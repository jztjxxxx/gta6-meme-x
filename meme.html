<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:1200px; overflow:hidden; background:#1b1035; }
  svg { display:block; }
  .cap { font-family:'Arial Black', Arial, sans-serif; font-weight:900; fill:#fff;
         stroke:#000; stroke-width:10px; paint-order:stroke; letter-spacing:1px; }
</style></head><body>
<svg width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1055"/>
      <stop offset="0.35" stop-color="#7597de"/>
      <stop offset="0.62" stop-color="#ff5e8a"/>
      <stop offset="0.82" stop-color="#ff9a3d"/>
      <stop offset="1" stop-color="#ffd23d"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3d"/>
      <stop offset="1" stop-color="#7b2ff7"/>
    </linearGradient>
    <clipPath id="sunclip"><circle cx="600" cy="560" r="235"/></clipPath>
  </defs>

  <!-- sky + sun -->
  <rect x="0" y="0" width="1200" height="760" fill="url(#sky)"/>
  <circle cx="600" cy="560" r="235" fill="#ffe259"/>
  <g clip-path="url(#sunclip)" fill="#ff5e8a" opacity="0.85">
    <rect x="360" y="585" width="480" height="10"/>
    <rect x="360" y="620" width="480" height="14"/>
    <rect x="360" y="660" width="480" height="18"/>
    <rect x="360" y="705" width="480" height="24"/>
  </g>

  <!-- skyline -->
  <g fill="#241243">
    <rect x="0" y="520" width="90" height="240"/><rect x="100" y="470" width="70" height="290"/>
    <rect x="180" y="545" width="110" height="215"/><rect x="300" y="495" width="60" height="265"/>
    <rect x="905" y="500" width="70" height="260"/><rect x="985" y="455" width="85" height="305"/>
    <rect x="1080" y="530" width="120" height="230"/>
  </g>
  <g fill="#ffd23d" opacity="0.9">
    <rect x="115" y="500" width="10" height="14"/><rect x="135" y="540" width="10" height="14"/>
    <rect x="205" y="575" width="10" height="14"/><rect x="1000" y="490" width="10" height="14"/>
    <rect x="1025" y="530" width="10" height="14"/><rect x="1105" y="565" width="10" height="14"/>
  </g>

  <!-- sea + ground -->
  <rect x="0" y="760" width="1200" height="90" fill="url(#sea)" opacity="0.9"/>
  <rect x="0" y="850" width="1200" height="350" fill="#170b2e"/>

  <!-- palms -->
  <g stroke="#12081f" stroke-width="16" fill="none" stroke-linecap="round">
    <path d="M120 870 Q 100 700 150 560"/>
    <path d="M1080 870 Q 1105 705 1055 565"/>
  </g>
  <g stroke="#12081f" stroke-width="13" fill="none" stroke-linecap="round">
    <path d="M150 560 Q 60 520 20 560"/><path d="M150 560 Q 120 480 60 460"/>
    <path d="M150 560 Q 200 480 260 465"/><path d="M150 560 Q 230 520 275 555"/>
    <path d="M1055 565 Q 1145 525 1185 565"/><path d="M1055 565 Q 1085 485 1145 465"/>
    <path d="M1055 565 Q 1005 485 945 470"/><path d="M1055 565 Q 975 525 930 560"/>
  </g>

  <!-- VICE CITY sign -->
  <text x="70" y="150" font-family="'Arial Black', Arial, sans-serif" font-size="54" font-weight="900"
        fill="#ff71ce" stroke="#12081f" stroke-width="6" paint-order="stroke" transform="rotate(-4 70 150)">VICE CITY</text>

  <!-- wanted stars -->
  <g fill="#ffd23d" stroke="#12081f" stroke-width="4" transform="translate(0 62)">
    <path d="M880 60 l13 26 29 4 -21 20 5 29 -26 -14 -26 14 5 -29 -21 -20 29 -4 z"/>
    <path d="M945 60 l13 26 29 4 -21 20 5 29 -26 -14 -26 14 5 -29 -21 -20 29 -4 z"/>
    <path d="M1010 60 l13 26 29 4 -21 20 5 29 -26 -14 -26 14 5 -29 -21 -20 29 -4 z"/>
    <path d="M1075 60 l13 26 29 4 -21 20 5 29 -26 -14 -26 14 5 -29 -21 -20 29 -4 z"/>
  </g>

  <!-- bench -->
  <g>
    <rect x="215" y="935" width="770" height="26" rx="8" fill="#3d2b12"/>
    <rect x="215" y="985" width="770" height="22" rx="8" fill="#3d2b12"/>
    <rect x="245" y="900" width="22" height="180" fill="#241a0a"/>
    <rect x="933" y="900" width="22" height="180" fill="#241a0a"/>
    <rect x="215" y="905" width="770" height="18" rx="8" fill="#54390f"/>
  </g>

  <!-- skeleton (waited too long) -->
  <g>
    <circle cx="395" cy="800" r="52" fill="#e8e4d8"/>
    <rect x="368" y="838" width="54" height="30" rx="8" fill="#e8e4d8"/>
    <circle cx="376" cy="798" r="11" fill="#14100a"/><circle cx="414" cy="798" r="11" fill="#14100a"/>
    <path d="M395 812 l7 12 h-14 z" fill="#14100a"/>
    <g stroke="#14100a" stroke-width="3"><path d="M378 845 v18"/><path d="M395 845 v18"/><path d="M412 845 v18"/></g>
    <g stroke="#e8e4d8" stroke-width="13" fill="none" stroke-linecap="round">
      <path d="M360 880 Q 330 905 345 935"/>
      <path d="M430 880 Q 465 900 470 930"/>
    </g>
    <g stroke="#cfc9ba" stroke-width="9" fill="none">
      <path d="M362 878 q60 -16 66 0"/><path d="M364 900 q60 -16 64 0"/><path d="M368 922 q56 -14 60 0"/>
    </g>
    <!-- controller in skeleton hands -->
    <rect x="330" y="922" width="150" height="52" rx="24" fill="#1c1c22"/>
    <circle cx="362" cy="948" r="8" fill="#ff5e8a"/><circle cx="448" cy="948" r="8" fill="#37e0a0"/>
    <rect x="398" y="940" width="18" height="6" fill="#888"/><rect x="404" y="934" width="6" height="18" fill="#888"/>
    <!-- dusty pre-order receipt -->
    <g transform="rotate(8 300 1010)">
      <rect x="248" y="975" width="104" height="66" fill="#d8d2c0"/>
      <text x="300" y="1002" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#555">PRE-ORDER</text>
      <text x="300" y="1026" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#555">2013</text>
    </g>
  </g>

  <!-- make.fun ghost (already paid) -->
  <g>
    <!-- body -->
    <path d="M655 1085 L655 800 Q655 690 760 690 Q865 690 865 800 L865 1085 L825 1048 L785 1085 L745 1048 L705 1085 L678 1052 Z"
          fill="#ffffff" stroke="#14100a" stroke-width="7"/>
    <!-- cash fan, held up at his right -->
    <g transform="rotate(14 935 900)">
      <rect x="885" y="838" width="48" height="96" rx="6" fill="#37e0a0" stroke="#0d5c3c" stroke-width="4"/>
      <rect x="925" y="830" width="48" height="96" rx="6" fill="#37e0a0" stroke="#0d5c3c" stroke-width="4"/>
      <rect x="965" y="838" width="48" height="96" rx="6" fill="#37e0a0" stroke="#0d5c3c" stroke-width="4"/>
      <text x="909" y="900" font-family="Arial" font-size="36" font-weight="bold" fill="#0d5c3c">$</text>
      <text x="949" y="892" font-family="Arial" font-size="36" font-weight="bold" fill="#0d5c3c">$</text>
      <text x="989" y="900" font-family="Arial" font-size="36" font-weight="bold" fill="#0d5c3c">$</text>
    </g>
    <!-- gold chain -->
    <path d="M700 838 Q760 905 820 838" fill="none" stroke="#ffd23d" stroke-width="11"/>
    <circle cx="760" cy="898" r="14" fill="#ffd23d" stroke="#b8860b" stroke-width="3"/>
    <!-- face: smug -->
    <ellipse cx="718" cy="775" rx="13" ry="19" fill="#14100a"/>
    <ellipse cx="802" cy="775" rx="13" ry="19" fill="#14100a"/>
    <path d="M722 822 Q760 845 800 820" fill="none" stroke="#14100a" stroke-width="8" stroke-linecap="round"/>
    <path d="M695 738 Q718 726 741 738" fill="none" stroke="#14100a" stroke-width="7" stroke-linecap="round"/>
    <path d="M779 738 Q802 726 825 738" fill="none" stroke="#14100a" stroke-width="7" stroke-linecap="round"/>
    <!-- phone with make.fun -->
    <g transform="rotate(10 640 950)">
      <rect x="600" y="892" width="86" height="128" rx="12" fill="#14100a"/>
      <rect x="608" y="904" width="70" height="92" rx="6" fill="#7b2ff7"/>
      <text x="643" y="945" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">make</text>
      <text x="643" y="966" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">.fun</text>
      <text x="643" y="988" text-anchor="middle" font-family="Arial" font-size="15" fill="#ffd23d">$ $ $</text>
    </g>
  </g>

  <!-- captions -->
  <text class="cap" x="600" y="92" text-anchor="middle" font-size="66">WAITED 13 YEARS FOR GTA VI</text>
  <text class="cap" x="600" y="1092" text-anchor="middle" font-size="60">THE make.fun GHOST GOT PAID</text>
  <text class="cap" x="600" y="1150" text-anchor="middle" font-size="60">TO MEME IT FIRST</text>
</svg>
</body></html>
